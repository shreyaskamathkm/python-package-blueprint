[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-package-blueprint"
version = "0.1.0"
description = "A modern, batteries-included Cookiecutter template for creating robust Python packages."
readme = "README.md"
authors = [
    { name = "Shreyas Kamath", email = "shreyaskamathkm@gmail.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "cookiecutter>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cookies>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hooks"]

[tool.pytest.ini_options]
norecursedirs = ["{{cookiecutter.project_slug}}"]
