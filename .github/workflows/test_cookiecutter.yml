name: Test Template

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-template:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install cookiecutter pytest-cookies pytest

    - name: Test generation (Default / ML Stack)
      run: |
        # Generate project with ML stack
        cookiecutter . --no-input project_name="ML Project" project_slug="ml_project" include_ml_stack="yes" include_cli="yes"

        # Check structure
        if [ ! -d "ml_project/configs" ]; then echo "Configs missing"; exit 1; fi
        
        # Install and test
        cd ml_project
        pip install .[dev]
        make test

    - name: Test generation (Lite / No ML)
      run: |
        # Generate project without ML stack
        cookiecutter . --no-input project_name="Lite Project" project_slug="lite_project" include_ml_stack="no" include_cli="no"

        # Check structure (ensure no ML files)
        if [ -d "lite_project/configs" ]; then echo "Configs should not exist"; exit 1; fi
        
        # Install and test
        cd lite_project
        pip install .[dev]
        make test
