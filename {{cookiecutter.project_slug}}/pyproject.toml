[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "{{cookiecutter.project_slug}}"
version = "{{cookiecutter.version}}"
description = "{{cookiecutter.description}}"
readme = "README.md"
authors = [{ name = "{{cookiecutter.author}}"}]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
dependencies = [
    "pydantic>=2.11.7",
    "pyyaml>=6.0.1",
    "rich>=14.1.0",
    "rich>=14.1.0",
    {% if cookiecutter.include_ml_stack != "yes" -%}
    "click>=8.1.7",
    {% endif -%}
    {% if cookiecutter.include_ml_stack == "yes" -%}
    "torch>=2.2.0",
    "hydra-core>=1.3.2",
    "mlflow>=2.10.0",
    "numpy>=1.26.0",
    {% endif -%}
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.3",
    "mypy>=1.13.0",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "types-PyYAML>=6.0.12.20240311",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pre-commit>=3.5.0",
    "bump-my-version>=0.16.0",
    "build>=1.0.0",
    "twine>=4.0.2",
]

[tool.setuptools.packages.find]
include = ["{{cookiecutter.project_slug}}*"]
exclude = ["configs", "datasets", "artifacts", "notebooks", "tests", "docs"]

[project.scripts]
{% if cookiecutter.include_ml_stack == "yes" -%}
cli = "{{cookiecutter.project_slug}}.cli:main"
{% else -%}
cli = "{{cookiecutter.project_slug}}.cli:cli"
{% endif -%}

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C", "B", "UP", "PT", "SIM", "RUF"
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true

[tool.bumpversion]
current_version = "{{cookiecutter.version}}"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "{{cookiecutter.project_slug}}/__version__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'